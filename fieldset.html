<!DOCTYPE html>
<html>
    <body>
        <h1>
            The fieldset element 
        </h1>
        <form>
            <fieldset name="personal details">
                <label for="fname">first name:</label>
                <input type="text" id="fname" name="fname"><br>
                <label for="lname">Last name:</fieldset></label>
                <input type="text" id="lname" name="lname"><br>
                <label for="email">email:</fieldset></label>
                <input type="text" id="email" name="email"><br>
                <label for="phone">Phone number:</fieldset></label>
                <input type="tel" id="phone" name="phone"><br>
            </fieldset>    
            <br>
            <fieldset name="professional_details"> 
                <label for="occupation">Occupation:</label>
                <input type="text" id="occupation" name="occupation"><br>
                <label for="company">Company:</label>
                <input type="text" id="company" name="company"><br>
                <label for="start">Start Date:</label>
                <input type="date" id="start" name="start"><br>
                <label for="end">End Date:</label>
                <input type="date" id="end" name="end"><br>
            </fieldset>
            <br>
            <input type="submit" value="Submit">
        </form>
    </body>
</html>
